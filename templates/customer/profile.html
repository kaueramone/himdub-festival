{% extends 'customer/base.html' %}{% block content %}<div class="page-heading"><div><p class="app-overline">DADOS DE CONTACTO</p><h1>Os meus dados</h1></div></div><section class="app-card"><form method="post" class="app-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email verificado<input value="{{ account.email }}" readonly type="email"></label><label>Nome<input name="name" value="{{ account.name }}" maxlength="120" autocomplete="name"></label><label>Telefone (opcional)<input name="phone" value="{{ account.phone }}" maxlength="40" autocomplete="tel" type="tel"></label><p class="app-hint">Estes são os contactos da tua conta. Alterar o nome aqui não muda o titular dos bilhetes nem os dados das compras anteriores. Para isso, abre o bilhete e envia um pedido à organização.</p><button class="btn btn--primary">Guardar os meus dados</button></form></section>{% endblock %}
