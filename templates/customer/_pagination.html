<nav class="app-pagination" aria-label="Paginação">{% if pagination.has_prev %}<a href="{{ url_for(request.endpoint,page=pagination.prev_num) }}">← Anterior</a>{% endif %}<span>Página {{ pagination.page }} de {{ pagination.pages or 1 }}</span>{% if pagination.has_next %}<a href="{{ url_for(request.endpoint,page=pagination.next_num) }}">Seguinte →</a>{% endif %}</nav>
