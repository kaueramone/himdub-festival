<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>{% block title %}Acesso · HIM Dub Festival{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css',v=asset_version) }}">{% include 'partials/_app_icons.html' %}</head><body class="admin-app access-page"><main class="access-card"><img class="access-logo" src="{{ url_for('static',filename='img/logo-him-dub.png') }}" alt="HIM Dub Festival">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="app-notice {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
