{% extends 'admin/base.html' %}{% block content %}<div class="page-heading"><h1>{{ 'Editar palco' if stage.id else 'Adicionar palco' }}</h1><a class="btn btn--outline" href="{{ url_for('admin.lineup_admin') }}">← Lineup</a></div><section class="app-card"><form method="post" class="app-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome<input name="name" value="{{ stage.name or '' }}" maxlength="120" required></label><label>Identificador<input name="slug" {{ 'readonly' if stage.id else '' }} value="{{ stage.slug or '' }}" maxlength="80" pattern="[a-z0-9]+(-[a-z0-9]+)*" required placeholder="novo-palco"></label><label>Descrição<textarea name="description" rows="4" maxlength="10000">{{ stage.description or '' }}</textarea></label><label>Ordem<input type="number" name="sort_order" value="{{ stage.sort_order or 0 }}" min="-10000" max="10000"></label><label class="app-checkbox"><input type="checkbox" name="published" {% if stage.published or not stage.id %}checked{% endif %}> Mostrar palco e respetivos artistas</label><button class="btn btn--primary">Guardar palco</button></form></section>{% endblock %}
