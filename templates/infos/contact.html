{% extends "base.html" %}
{% block title %}{{ _('Contact') }} — HIM Dub Festival{% endblock %}

{% block content %}

<section class="page-hero page-hero--contact">
  <div class="container" data-reveal>
    <p class="eyebrow">{{ _('Infos') }}</p>
    <h1>{{ _('Contact') }}</h1>

    <div class="contact-grid">
      {% for item in native_content %}<div><h4>{{ item.title }}</h4><a href="mailto:{{ item.email }}">{{ item.email }}</a></div>{% endfor %}
    </div>
  </div>
</section>

{% endblock %}
