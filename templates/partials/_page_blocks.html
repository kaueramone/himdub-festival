{% if page_blocks %}<section class="managed-content"><div class="container managed-grid {{ 'managed-list' if page_settings and page_settings.layout=='list' else '' }}">{% for block in page_blocks %}<article class="managed-card">{% if block.image_url %}<img src="{{ block.image_url }}" alt="" loading="lazy" decoding="async">{% endif %}<div><h2>{{ translate_public(block.title) }}</h2><p>{{ translate_public(block.text) }}</p>{% if block.link_url %}<a class="btn btn--outline" href="{{ block.link_url }}">{{ translate_public(block.link_label or 'Saber mais') }} →</a>{% endif %}</div></article>{% endfor %}</div></section>{% endif %}
